name: opportunity scan offline
on:
  pull_request:
    paths:
      - src/opportunity_*.py
      - tests/test_opportunity_*.py
      - tests/test_execution_terminal_reliability.py
      - config/opportunity-scan*.toml
      - .github/workflows/opportunity-scan.yml
  push:
    branches: [main]
    paths:
      - src/opportunity_*.py
      - tests/test_opportunity_*.py
      - tests/test_execution_terminal_reliability.py
      - config/opportunity-scan*.toml
      - .github/workflows/opportunity-scan.yml
permissions:
  contents: read
jobs:
  pure-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.6
      - name: Test core, config and event-only state without native dependencies
        run: >-
          uv run --isolated --no-project --python 3.12.9 --with pytest==9.1.1
          python -m pytest -q -p no:cacheprovider
          tests/test_opportunity_core.py tests/test_opportunity_scan.py tests/test_opportunity_native.py
          tests/test_opportunity_universe.py tests/test_opportunity_connections.py
          tests/test_opportunity_coalescing.py
          tests/test_opportunity_affected_pairs.py
          tests/test_opportunity_wakeup.py
          tests/test_opportunity_wakeup_native.py
          tests/test_opportunity_candidate_path.py
          tests/test_opportunity_trade.py tests/test_opportunity_live.py
          tests/test_opportunity_live_rebalance.py tests/test_opportunity_forced_reduction.py
          tests/test_opportunity_unhedged_risk.py
          tests/test_execution_terminal_reliability.py
          tests/test_opportunity_entry_evidence.py
          tests/test_opportunity_entry_admission.py
          tests/test_opportunity_leverage.py
          tests/test_opportunity_exit_reliability.py
          tests/test_opportunity_account_scope.py
          tests/test_opportunity_timing.py
          tests/test_opportunity_account_reconciliation.py
          tests/test_opportunity_account_read_lifecycle.py tests/test_opportunity_restart.py
          tests/test_opportunity_live_flow.py
          tests/test_opportunity_balances.py tests/test_opportunity_balance_runner.py
          tests/test_opportunity_loss_monitor.py

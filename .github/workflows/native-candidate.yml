name: native candidate acceptance

# A full native SHA is supplied for every run. No venue credentials are used.
on:
  workflow_dispatch:
    inputs:
      app_sha:
        description: Full application commit SHA containing the candidate scripts
        required: true
        type: string
      native_sha:
        description: Full native repository commit SHA containing the controlled builder
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - name: Validate source ref
        shell: pwsh
        env:
          APP_SHA: ${{ inputs.app_sha }}
          NATIVE_SHA: ${{ inputs.native_sha }}
        run: |
          if ($env:APP_SHA -notmatch '^[0-9a-f]{40}$') { throw 'app_sha must be a full commit SHA' }
          if ($env:NATIVE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'native_sha must be a full commit SHA' }

      - name: Checkout application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.app_sha }}
          path: app
          persist-credentials: false

      - name: Checkout native fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mmyyrroonn/nautilus_trader
          ref: ${{ inputs.native_sha }}
          path: native
          persist-credentials: false

      - name: Verify checked out ref
        shell: pwsh
        env:
          APP_SHA: ${{ inputs.app_sha }}
          NATIVE_SHA: ${{ inputs.native_sha }}
        run: |
          $appActual = git -C app rev-parse HEAD
          if ($appActual -ne $env:APP_SHA) { throw 'app ref resolved to another SHA' }
          $nativeActual = git -C native rev-parse HEAD
          if ($nativeActual -ne $env:NATIVE_SHA) { throw 'native ref resolved to another SHA' }

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.6

      - name: Install pinned Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.98.0
          cache: false

      - name: Install pinned Python
        shell: pwsh
        run: uv python install 3.12.9

      - name: Sync native build environment
        shell: pwsh
        run: |
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $env:GITHUB_WORKSPACE 'native/.venv'
          Push-Location native/python
          uv sync --locked --all-groups --all-extras --no-install-package nautilus-trader --inexact --managed-python --python 3.12.9
          if ($LASTEXITCODE -ne 0) { throw 'native uv sync failed' }
          Pop-Location

      - name: Sync application environment
        shell: pwsh
        run: |
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $env:GITHUB_WORKSPACE 'app/.venv'
          Push-Location app
          uv sync --locked --inexact --python 3.12.9
          if ($LASTEXITCODE -ne 0) { throw 'application uv sync failed' }
          Pop-Location

      - name: Build and test bound candidate
        shell: pwsh
        run: |
          $native = Join-Path $env:GITHUB_WORKSPACE 'native'
          $app = Join-Path $env:GITHUB_WORKSPACE 'app'
          $output = Join-Path $env:GITHUB_WORKSPACE 'native-output'
          if ($IsWindows) {
            $nativePython = Join-Path $native '.venv/Scripts/python.exe'
            $appPython = Join-Path $app '.venv/Scripts/python.exe'
          } else {
            $nativePython = Join-Path $native '.venv/bin/python'
            $appPython = Join-Path $app '.venv/bin/python'
          }
          & $appPython (Join-Path $app 'scripts/build_native.py') --native-root $native --native-python $nativePython --output-dir $output --profile release --online
          if ($LASTEXITCODE -ne 0) { throw 'native build failed' }
          $manifest = Join-Path $output 'native-provenance.json'
          $provenance = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          $wheel = Join-Path $output $provenance.wheel.filename
          Push-Location $app
          & $appPython scripts/install_native.py --python $appPython --local-override --native-root $native --wheel $wheel --provenance $manifest --sha256 $provenance.wheel.sha256 --output .native-cache/installed.json
          if ($LASTEXITCODE -ne 0) { throw 'native install failed' }
          & $appPython scripts/test_integration.py --python $appPython --wheel $wheel --provenance $manifest --sha256 $provenance.wheel.sha256 --config config/limits.toml --output .native-cache/integration.json tests
          if ($LASTEXITCODE -ne 0) { throw 'offline integration failed' }
          Pop-Location

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-candidate-${{ runner.os }}
          path: |
            native-output/*
            app/.native-cache/*.json
          include-hidden-files: true
          if-no-files-found: warn

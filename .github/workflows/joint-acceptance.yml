name: joint native and application acceptance

# Manual, no-secrets run. Both refs are immutable full commit SHAs.
on:
  workflow_dispatch:
    inputs:
      app_sha:
        description: Full Nautilus-Perps commit SHA
        required: true
        type: string
      native_sha:
        description: Full nautilus_trader fork commit SHA
        required: true
        type: string
      native_wheel_run_id:
        description: Optional trusted joint run whose platform wheel may be reused
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  joint:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Validate immutable inputs
        id: validate
        shell: pwsh
        env:
          APP_SHA: ${{ inputs.app_sha }}
          NATIVE_SHA: ${{ inputs.native_sha }}
          NATIVE_WHEEL_RUN_ID: ${{ inputs.native_wheel_run_id }}
        run: |
          if ($env:NATIVE_WHEEL_RUN_ID -and $env:NATIVE_WHEEL_RUN_ID -cnotmatch '^[1-9][0-9]*$') { throw 'native_wheel_run_id must be empty or positive decimal digits' }
          if ($env:APP_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'app_sha must be a lowercase full commit SHA' }
          if ($env:NATIVE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'native_sha must be a lowercase full commit SHA' }

      - name: Checkout application
        id: app_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.app_sha }}
          path: app
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout native fork
        id: native_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mmyyrroonn/nautilus_trader
          ref: ${{ inputs.native_sha }}
          path: native
          persist-credentials: false

      - name: Verify resolved refs and clean checkouts
        id: verify_refs
        shell: pwsh
        env:
          APP_SHA: ${{ inputs.app_sha }}
          NATIVE_SHA: ${{ inputs.native_sha }}
        run: |
          if ((git -C app rev-parse HEAD) -cne $env:APP_SHA) { throw 'application ref resolution changed' }
          if ((git -C native rev-parse HEAD) -cne $env:NATIVE_SHA) { throw 'native ref resolution changed' }
          if (git -C app status --porcelain) { throw 'application checkout is dirty' }
          if (git -C native status --porcelain) { throw 'native checkout is dirty' }
          if ((Test-Path app/.env) -or (Test-Path native/.env)) { throw 'dotenv credentials must be absent' }

      - name: Set up pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.6

      - name: Install pinned Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.98.0
          cache: false
          override: true
          components: rustfmt, clippy

      - name: Install pinned Python
        shell: pwsh
        run: uv python install 3.12.9

      - name: Sync locked Python dependencies
        shell: pwsh
        run: |
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $env:GITHUB_WORKSPACE 'native/.venv'
          Push-Location native/python
          uv sync --locked --all-groups --all-extras --no-install-package nautilus-trader --inexact --managed-python --python 3.12.9
          if ($LASTEXITCODE -ne 0) { throw 'native locked dependency sync failed' }
          Pop-Location
          $env:UV_PROJECT_ENVIRONMENT = Join-Path $env:GITHUB_WORKSPACE 'app/.venv'
          Push-Location app
          uv sync --locked --inexact --managed-python --python 3.12.9
          if ($LASTEXITCODE -ne 0) { throw 'application locked dependency sync failed' }
          Pop-Location

      - name: Resolve pinned cargo-nextest
        shell: pwsh
        run: |
          $version = bash native/scripts/cargo-tool-version.sh cargo-nextest
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^0[.]9[.]143$') { throw 'unexpected cargo-nextest version' }
          "CARGO_NEXTEST_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install pinned cargo-nextest
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Fetch locked Cargo dependencies
        shell: pwsh
        run: |
          Push-Location native
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'native Cargo fetch failed' }
          Pop-Location

      - name: Run native adapter checks
        id: native_checks
        shell: pwsh
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $env:CARGO_NET_OFFLINE = 'true'
          if ($IsWindows) { $nativePython = Join-Path $env:GITHUB_WORKSPACE 'native/.venv/Scripts/python.exe' }
          else { $nativePython = Join-Path $env:GITHUB_WORKSPACE 'native/.venv/bin/python' }
          Push-Location native
          & $nativePython scripts/adapter-evidence/test_native_checks.py
          if ($LASTEXITCODE -ne 0) { throw 'native check tooling regression failed' }
          & $nativePython scripts/adapter-evidence/native_checks.py --crates nautilus-aster nautilus-ondo nautilus-backpack nautilus-portfolio --output (Join-Path $evidence 'native-checks.json') --logs (Join-Path $evidence 'native-checks-logs')
          if ($LASTEXITCODE -ne 0) { throw 'native adapter checks failed' }
          Pop-Location

      - name: Build one source-bound wheel
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SHA: ${{ inputs.app_sha }}
          NATIVE_SHA: ${{ inputs.native_sha }}
          NATIVE_WHEEL_RUN_ID: ${{ inputs.native_wheel_run_id }}
          MATRIX_OS: ${{ matrix.os }}
        run: |
          $native = Join-Path $env:GITHUB_WORKSPACE 'native'
          $app = Join-Path $env:GITHUB_WORKSPACE 'app'
          $output = Join-Path $env:GITHUB_WORKSPACE 'wheel-output'
          if ($IsWindows) {
            $nativePython = Join-Path $native '.venv/Scripts/python.exe'
            $appPython = Join-Path $app '.venv/Scripts/python.exe'
          } else {
            $nativePython = Join-Path $native '.venv/bin/python'
            $appPython = Join-Path $app '.venv/bin/python'
          }
          if (-not $env:NATIVE_WHEEL_RUN_ID) {
            & $appPython (Join-Path $app 'scripts/build_native.py') --native-root $native --native-python $nativePython --output-dir $output --profile release --online
            if ($LASTEXITCODE -ne 0) { throw 'source-bound wheel build failed' }
          } else {
            if ($env:NATIVE_WHEEL_RUN_ID -cnotmatch '^[1-9][0-9]*$') { throw 'invalid donor run ID' }
            function Read-GitHubRecord([string] $endpoint) {
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                $payload = gh api $endpoint 2>$null
                if ($LASTEXITCODE -eq 0) { return ($payload | ConvertFrom-Json) }
                if ($attempt -lt 3) { Start-Sleep -Seconds (2 * $attempt) }
              }
              throw 'GitHub donor metadata request failed after three attempts'
            }
            $endpoint = "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:NATIVE_WHEEL_RUN_ID"
            $donor = Read-GitHubRecord $endpoint
            if ($donor.event -cne 'workflow_dispatch' -or $donor.path -cne '.github/workflows/joint-acceptance.yml' -or $donor.repository.full_name -cne $env:GITHUB_REPOSITORY -or $donor.head_repository.full_name -cne $env:GITHUB_REPOSITORY) {
              throw 'donor must be a same-repository manual joint acceptance run'
            }
            if ($donor.head_sha -cnotmatch '^[0-9a-f]{40}$') { throw 'invalid donor app SHA' }
            git -C $app merge-base --is-ancestor $donor.head_sha $env:APP_SHA
            if ($LASTEXITCODE -ne 0) { throw 'donor app SHA must be an ancestor of the selected app SHA' }
            $deadline = [DateTime]::UtcNow.AddMinutes(30)
            $artifactName = "joint-acceptance-$env:RUNNER_OS"
            while ($true) {
              $jobs = Read-GitHubRecord "$endpoint/jobs?filter=latest&per_page=100"
              $artifacts = Read-GitHubRecord "$endpoint/artifacts?per_page=100"
              if ($jobs.total_count -gt 100 -or $artifacts.total_count -gt 100) { throw 'ambiguous donor pagination' }
              $platformJobs = @($jobs.jobs | Where-Object { $_.name -ceq "joint ($env:MATRIX_OS)" })
              $platformArtifacts = @($artifacts.artifacts | Where-Object { $_.name -ceq $artifactName })
              if ($platformJobs.Count -gt 1 -or $platformArtifacts.Count -gt 1) { throw 'ambiguous donor platform job or artifact' }
              $platformJob = $platformJobs[0]
              $buildStep = @($platformJob.steps | Where-Object { $_.name -ceq 'Build one source-bound wheel' })
              $installStep = @($platformJob.steps | Where-Object { $_.name -ceq 'Install and verify the built wheel' })
              $builtAndInstalled = $buildStep.Count -eq 1 -and $installStep.Count -eq 1 -and $buildStep[0].conclusion -ceq 'success' -and $installStep[0].conclusion -ceq 'success'
              if ($platformJob.status -ceq 'completed' -and -not $builtAndInstalled) { throw 'donor platform build or install failed' }
              if ($platformArtifacts.Count -eq 1 -and $builtAndInstalled) {
                $artifact = $platformArtifacts[0]
                break
              }
              if ([DateTime]::UtcNow -ge $deadline) { throw 'donor platform artifact was unavailable after 30 minutes' }
              Write-Output "Waiting for donor $env:NATIVE_WHEEL_RUN_ID platform artifact ($env:RUNNER_OS)"
              Start-Sleep -Seconds 20
            }
            if ($artifact.expired -ne $false -or $artifact.digest -cnotmatch '^sha256:[0-9a-f]{64}$' -or $artifact.workflow_run.id -ne $donor.id -or $artifact.workflow_run.head_sha -cne $donor.head_sha -or $artifact.workflow_run.repository_id -ne $donor.repository.id -or $artifact.workflow_run.head_repository_id -ne $donor.head_repository.id) {
              throw 'donor artifact identity, expiration or digest is invalid'
            }
            $zipPath = Join-Path $env:RUNNER_TEMP "native-wheel-donor-$($artifact.id).zip"
            $handler = [System.Net.Http.HttpClientHandler]::new()
            $handler.AllowAutoRedirect = $false
            $client = [System.Net.Http.HttpClient]::new($handler)
            try {
              $client.DefaultRequestHeaders.UserAgent.ParseAdd('joint-native-wheel-reuse')
              $client.DefaultRequestHeaders.Authorization = [System.Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer', $env:GH_TOKEN)
              $response = $client.GetAsync("https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$($artifact.id)/zip").GetAwaiter().GetResult()
              try {
                if ([int]$response.StatusCode -ne 302) { throw 'donor archive redirect was unavailable' }
                $downloadUri = $response.Headers.Location
                if (-not $downloadUri.IsAbsoluteUri -or $downloadUri.Scheme -cne 'https' -or $downloadUri.UserInfo) { throw 'donor archive redirect was invalid' }
              } finally { $response.Dispose() }
            } finally { $client.Dispose() }
            try {
              # A separate storage request carries no token; never print its signed URL.
              Invoke-WebRequest -Uri $downloadUri -OutFile $zipPath -TimeoutSec 600
            } catch { throw 'donor archive download failed' }
            $archiveDigest = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ("sha256:$archiveDigest" -cne $artifact.digest) { throw 'donor archive digest mismatch' }
            $extract = @'
          import hashlib, json, re, shutil, sys, zipfile
          from pathlib import Path
          archive_path, output_path, native_sha = sys.argv[1:]
          output = Path(output_path)
          if output.exists():
              raise SystemExit("wheel output already exists")
          with zipfile.ZipFile(archive_path) as archive:
              names = archive.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit("duplicate archive members")
              manifest_name = "wheel-output/native-provenance.json"
              input_name = "wheel-output/native-build-input.json"
              manifest = json.loads(archive.read(manifest_name))
              build_input = json.loads(archive.read(input_name))
              declared = manifest.get("declared_native", {})
              if (manifest.get("source_binding") != "verified"
                  or declared.get("commit") != native_sha or declared.get("dirty") != []
                  or type(declared.get("dirty_count")) is not int or declared["dirty_count"] != 0
                  or build_input.get("native") != declared
                  or manifest.get("declared_build", {}).get("profile") != "release"):
                  raise SystemExit("donor source-bound release identity mismatch")
              filename = manifest.get("wheel", {}).get("filename", "")
              if (not isinstance(filename, str) or not filename.startswith("nautilus_trader-")
                  or not filename.endswith(".whl") or "/" in filename or "\\" in filename):
                  raise SystemExit("invalid donor wheel filename")
              wheel_name = "wheel-output/" + filename
              wheel_names = [name for name in names if name.startswith("wheel-output/") and name.endswith(".whl")]
              expected = manifest["wheel"].get("sha256", "")
              if wheel_names != [wheel_name] or not re.fullmatch(r"[0-9a-f]{64}", expected):
                  raise SystemExit("donor must contain one named wheel with a SHA-256")
              output.mkdir()
              for source in (manifest_name, input_name, wheel_name):
                  with archive.open(source) as reader, (output / source.split("/")[-1]).open("wb") as writer:
                      shutil.copyfileobj(reader, writer)
              with (output / filename).open("rb") as wheel:
                  if hashlib.file_digest(wheel, "sha256").hexdigest() != expected:
                      raise SystemExit("donor wheel digest mismatch")
          '@
            & $appPython -c $extract $zipPath $output $env:NATIVE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'donor wheel extraction or identity check failed' }
            $manifest = Get-Content -LiteralPath (Join-Path $output 'native-provenance.json') -Raw | ConvertFrom-Json
            $reuse = [ordered]@{
              donor_run_id = $donor.id
              donor_run_attempt = $donor.run_attempt
              donor_app_sha = $donor.head_sha
              donor_job_id = $platformJob.id
              donor_job_name = $platformJob.name
              artifact_id = $artifact.id
              artifact_name = $artifact.name
              artifact_digest = $artifact.digest
              archive_sha256 = $archiveDigest
              native_sha = $env:NATIVE_SHA
              wheel_sha256 = $manifest.wheel.sha256
            }
            "wheel_reuse=$($reuse | ConvertTo-Json -Depth 8 -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Output "Reused verified platform wheel from donor run $($donor.id), artifact $($artifact.id)"
          }

      - name: Install and verify the built wheel
        id: install
        shell: pwsh
        run: |
          $native = Join-Path $env:GITHUB_WORKSPACE 'native'
          $app = Join-Path $env:GITHUB_WORKSPACE 'app'
          $output = Join-Path $env:GITHUB_WORKSPACE 'wheel-output'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'evidence'
          if ($IsWindows) { $appPython = Join-Path $app '.venv/Scripts/python.exe' }
          else { $appPython = Join-Path $app '.venv/bin/python' }
          $provenancePath = Join-Path $output 'native-provenance.json'
          $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
          $wheel = Join-Path $output $provenance.wheel.filename
          Push-Location $app
          & $appPython scripts/install_native.py --additional-adapter backpack --python $appPython --local-override --native-root $native --wheel $wheel --provenance $provenancePath --sha256 $provenance.wheel.sha256 --output (Join-Path $evidence 'installed.json')
          if ($LASTEXITCODE -ne 0) { throw 'wheel install/identity failed' }
          Pop-Location

      - name: Run loopback-only application tests
        id: integration
        shell: pwsh
        env:
          APP_SHA: ${{ inputs.app_sha }}
          NATIVE_SHA: ${{ inputs.native_sha }}
        run: |
          $native = Join-Path $env:GITHUB_WORKSPACE 'native'
          $app = Join-Path $env:GITHUB_WORKSPACE 'app'
          $output = Join-Path $env:GITHUB_WORKSPACE 'wheel-output'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'evidence'
          if ($IsWindows) { $appPython = Join-Path $app '.venv/Scripts/python.exe' }
          else { $appPython = Join-Path $app '.venv/bin/python' }
          $provenancePath = Join-Path $output 'native-provenance.json'
          $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
          $wheel = Join-Path $output $provenance.wheel.filename
          $guardRecord = Join-Path $evidence 'offline-guard.json'
          $integrationRecord = Join-Path $evidence 'integration.json'
          & $appPython (Join-Path $app 'scripts/offline_guard.py') --output $guardRecord --workspace $app --workspace $native -- $appPython (Join-Path $app 'scripts/test_integration.py') --additional-adapter backpack --python $appPython --wheel $wheel --provenance $provenancePath --sha256 $provenance.wheel.sha256 --native-root $native --expected-app-sha $env:APP_SHA --expected-native-sha $env:NATIVE_SHA --offline-guard $guardRecord --require-clean --fail-on-skip --required-test tests/test_installed_wheel_livenode.py::test_installed_wheel_livenode_loopback_lifecycle --required-test tests/test_backpack_installed_wheel.py::test_installed_backpack_extension_matches_verified_wheel --required-test tests/test_backpack_installed_wheel.py::test_installed_restricted_authority_denies_new_risk_without_http_write --required-test tests/test_backpack_public_native.py::test_installed_native_messages_stale_gap_reconnect_and_bounded_stop --required-test tests/test_backpack_account_native.py::test_actual_readonly_node_balances_true_fills_and_no_writes --required-test tests/test_backpack_loopback_native.py::test_actual_strategy_ack_quote_stale_denial_fill_duplicate_cancel202_and_dirty_stop --required-test tests/test_backpack_loopback_native.py::test_unknown_post_is_not_rejected_retried_or_adopted_from_numeric_client_id --config (Join-Path $app 'config/limits.toml') --output $integrationRecord tests
          if ($LASTEXITCODE -ne 0) { throw 'loopback-only application tests failed' }

      - name: Write detailed joint audit
        id: joint_audit
        if: always()
        shell: pwsh
        env:
          APP_SHA: ${{ inputs.app_sha }}
          NATIVE_SHA: ${{ inputs.native_sha }}
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE 'app'
          $native = Join-Path $env:GITHUB_WORKSPACE 'native'
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $script = Join-Path $app 'scripts/joint_audit.py'
          if (-not (Test-Path $script)) { throw 'application checkout or joint audit script is missing' }
          if ($IsWindows) { $appPython = Join-Path $app '.venv/Scripts/python.exe' }
          else { $appPython = Join-Path $app '.venv/bin/python' }
          $auditor = if (Test-Path $appPython) { $appPython } else { 'python' }
          $auditArgs = @(
            $script, '--output', (Join-Path $evidence 'joint-audit.json'),
            '--app-root', $app, '--native-root', $native,
            '--app-sha', $env:APP_SHA, '--native-sha', $env:NATIVE_SHA,
            '--provenance', (Join-Path $env:GITHUB_WORKSPACE 'wheel-output/native-provenance.json'),
            '--native-checks', (Join-Path $evidence 'native-checks.json'),
            '--installed', (Join-Path $evidence 'installed.json'),
            '--integration', (Join-Path $evidence 'integration.json'),
            '--offline-guard', (Join-Path $evidence 'offline-guard.json')
          )
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'wheel-output/native-provenance.json'
          if (Test-Path $manifest) {
            try {
              $provenance = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
              if ($provenance.wheel.filename) {
                $auditArgs += @('--wheel', (Join-Path $env:GITHUB_WORKSPACE ('wheel-output/' + $provenance.wheel.filename)))
              }
            } catch {
              Write-Output 'build provenance is unreadable; detailed audit will record the build failure'
            }
          }
          & $auditor @auditArgs
          if ($LASTEXITCODE -ne 0) { throw 'joint audit script failed' }

      - name: Audit cross-layer result
        id: audit
        shell: pwsh
        env:
          APP_SHA: ${{ inputs.app_sha }}
          NATIVE_SHA: ${{ inputs.native_sha }}
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'evidence'
          $joint = Get-Content (Join-Path $evidence 'joint-audit.json') -Raw | ConvertFrom-Json
          if ($joint.status -ne 'passed') { throw ('joint audit failed: ' + ($joint.failure_layers -join ', ')) }
          $native = Get-Content (Join-Path $evidence 'native-checks.json') -Raw | ConvertFrom-Json
          $guard = Get-Content (Join-Path $evidence 'offline-guard.json') -Raw | ConvertFrom-Json
          $installed = Get-Content (Join-Path $evidence 'installed.json') -Raw | ConvertFrom-Json
          $integration = Get-Content (Join-Path $evidence 'integration.json') -Raw | ConvertFrom-Json
          $provenance = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'wheel-output/native-provenance.json') -Raw | ConvertFrom-Json
          if ($native.native.commit -cne $env:NATIVE_SHA) { throw 'native checks ran against a different SHA' }
          if ($native.identity_changed_during_checks) { throw 'native source changed during checks' }
          if (@($native.checks | Where-Object { $_.blocking -and $_.exit_code -ne 0 }).Count) { throw 'native blocking check failed' }
          if ($guard.status -ne 'passed' -or $guard.exit_code -ne 0) { throw 'offline network guard failed' }
          if ($guard.firewall_cleanup -eq $false) { throw 'Windows firewall cleanup failed' }
          if ($integration.status -ne 'passed' -or $integration.exit_code -ne 0) { throw 'application integration failed' }
          if ($integration.source_refs.app.resolved -cne $env:APP_SHA -or $integration.source_refs.native.resolved -cne $env:NATIVE_SHA) { throw 'application/native SHA mismatch' }
          if ($integration.candidate.wheel.sha256 -cne $provenance.wheel.sha256 -or $installed.wheel.sha256 -cne $provenance.wheel.sha256) { throw 'built, installed and tested wheels differ' }
          if ($integration.collection.items -lt 1188) { throw 'application test collection count declined below 1188' }
          if ($integration.collection.required_tests.'tests/test_installed_wheel_livenode.py::test_installed_wheel_livenode_loopback_lifecycle' -ne $true) { throw 'installed-wheel LiveNode test was not collected' }
          if ($integration.pytest.item_passed -lt 1188) { throw 'application passing item count declined below 1188' }
          if ($integration.pytest.subtests_passed -lt 97) { throw 'application subtest count declined below 97' }
          if ($integration.pytest.skipped -ne 0) { throw 'application tests were skipped' }
          if ($integration.pytest.counts.failed -ne 0 -or $integration.pytest.counts.errors -ne 0) { throw 'application tests failed' }
          Write-Output "joint acceptance passed for $env:APP_SHA + $env:NATIVE_SHA"

      - name: Write job-layer result
        if: always()
        shell: pwsh
        env:
          APP_SHA: ${{ inputs.app_sha }}
          NATIVE_SHA: ${{ inputs.native_sha }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          APP_CHECKOUT_OUTCOME: ${{ steps.app_checkout.outcome }}
          NATIVE_CHECKOUT_OUTCOME: ${{ steps.native_checkout.outcome }}
          VERIFY_REFS_OUTCOME: ${{ steps.verify_refs.outcome }}
          NATIVE_OUTCOME: ${{ steps.native_checks.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          JOINT_AUDIT_OUTCOME: ${{ steps.joint_audit.outcome }}
          NATIVE_WHEEL_RUN_ID: ${{ inputs.native_wheel_run_id }}
          WHEEL_REUSE: ${{ steps.build.outputs.wheel_reuse }}
        run: |
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'evidence'
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $record = [ordered]@{
            schema_version = 1
            platform = $env:RUNNER_OS
            input_app_sha = $env:APP_SHA
            input_native_sha = $env:NATIVE_SHA
            input_native_wheel_run_id = $env:NATIVE_WHEEL_RUN_ID
            outcomes = [ordered]@{
              validate = $env:VALIDATE_OUTCOME
              app_checkout = $env:APP_CHECKOUT_OUTCOME
              native_checkout = $env:NATIVE_CHECKOUT_OUTCOME
              verify_refs = $env:VERIFY_REFS_OUTCOME
              native_checks = $env:NATIVE_OUTCOME
              build = $env:BUILD_OUTCOME
              install = $env:INSTALL_OUTCOME
              integration = $env:INTEGRATION_OUTCOME
              audit = $env:AUDIT_OUTCOME
              joint_audit = $env:JOINT_AUDIT_OUTCOME
            }
          }
          if ($env:WHEEL_REUSE) { $record.wheel_reuse = $env:WHEEL_REUSE | ConvertFrom-Json }
          $record.failure_layer = @($record.outcomes.Keys | Where-Object { $record.outcomes[$_] -eq 'failure' } | Select-Object -First 1)[0]
          if (Test-Path app/.git) { $record.resolved_app_sha = git -C app rev-parse HEAD }
          if (Test-Path native/.git) { $record.resolved_native_sha = git -C native rev-parse HEAD }
          $manifest = Join-Path $env:GITHUB_WORKSPACE 'wheel-output/native-provenance.json'
          if (Test-Path $manifest) {
            try { $record.wheel_sha256 = (Get-Content $manifest -Raw | ConvertFrom-Json).wheel.sha256 }
            catch { $record.provenance_error = 'unreadable build provenance' }
          }
          $record | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'job-layer.json') -Encoding utf8

      - name: Upload joint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: joint-acceptance-${{ runner.os }}
          path: |
            evidence/**
            wheel-output/native-provenance.json
            wheel-output/native-build-input.json
            wheel-output/*.whl
          if-no-files-found: warn

[project]
name = "nautilus-perps"
version = "0.1.0"
description = "Hyperliquid (HIP-3 xyz dex) x Lighter x Aster cross-exchange spread feasibility validation"
requires-python = ">=3.12,<3.13"
dependencies = [
    # The fork wheel is installed by scripts/install_native.py from a verified manifest.
    "python-dotenv==1.2.3",
    "packaging==26.3",
    "numpy==2.5.2",
    "pandas==3.0.5",
    # Reference-price leg (src/ref_feed.py): the FUTUNN OPEN API quote WebSocket
    # (wss://webapi-quote.futunn.com/ws) and its Ed25519 / RSA-SHA256 auth signature.
    "websockets==17.1",
    "cryptography==50.0.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
required-version = "==0.12.6"

# Operator limits for src/maker_live.py (Lighter maker, Aster taker hedge).
#
# Every value here can only make the run SMALLER / SAFER.  src/live_limits.py holds a
# module-constant hard cap for each capped key and applies min(config, CAP): editing this
# file can never widen a limit, only tighten it.  A missing file, a missing section or a
# missing key falls back to the default shown in the comment, which is already inside the
# cap.  Run `maker_live.py --dry-run` to print the resolved table (configured / cap / applied).
#
# DEVIATION FROM PROMPT.md STAGE 3 - APPROVED BY THE USER 2026-09-08.  PROMPT.md says the
# mainnet stage is limited to "单日最多 20 次触发".  That number describes the old taker/taker
# arbitrage design, where one trigger is one round trip.  A two-sided market maker earns its
# edge from many small passive fills: a single 10-minute session already prints dozens.  So
# the daily budget below is expressed as FILLS, set to 300 here with a 500 hard cap, not 20
# triggers.  Note the counter counts fill EVENTS, so a partially filled clip contributes one
# per partial - the budget is consumed faster than "orders filled" would suggest.

[order]
# Notional of one resting clip on Lighter.  Hard cap 50 USD (PROMPT.md stage 3).
max_notional_usd = 20.0
# 0 = derive the floor from the venue's own minimum (min_base_amount / min_quote_amount).
# A positive value raises the floor.  If the venue minimum ever exceeds max_notional_usd the
# run refuses instead of sizing up.
min_notional_usd_floor = 0.0

[inventory]
# Gross |position| on the maker venue (Lighter), in USD.  Hard cap 100.
max_inventory_usd = 60.0
# Signed delta filled on Lighter but not yet hedged on Aster, in USD.  Hard cap 30.
# The opening side stops quoting while the unhedged delta is above this.
max_unhedged_usd = 15.0

[exposure]
# |Lighter position| + |Aster position|, in USD.  Hard cap 100 (PROMPT.md stage 3).
max_total_notional_usd = 100.0

[daily]
# Counters persist in reports/live/state_<env>_<symbol>.json so a restart cannot reset them.
# They roll over at the UTC day boundary recorded in that file.
# The BASE fill budget, in force unless the day has earned the extended one below.
max_fills = 300              # hard cap 500 (built-in fallback when this file is absent: 200)
# A day that is actually making money may run longer.  The extended budget replaces max_fills
# once today's realised net clears profit_gate_usd AND the trip-net EWMA is not negative; it
# then stays in force while realised net is merely still positive (hysteresis, so a session
# does not flip between the two caps around the gate), and re-locks as soon as realised net
# falls back to zero - a session already past 300 fills then stops at the next check.  The
# -5 USD loss kill switch below is unaffected and still applies throughout.
max_fills_profitable = 1500  # hard cap 3000
profit_gate_usd = 1.0        # must be strictly positive; a flat day never unlocks
# Lighter order transactions (create + modify + cancel).  The observed quoting rate is
# ~23 tx/min, so a full trading day needs ~33000; 20000 would stop a healthy session after
# about 14 hours.  Hard cap 60000 (built-in fallback when this file is absent: 20000).
max_tx = 40000

[kill]
# Cumulative net P&L (realized + mark-to-market) since the state file's day start, in USD.
# Hard cap 20.  A breach cancels every quote, hedges the residual and exits non-zero.
max_loss_usd = 5.0
# Round trips that closed at a negative net, back to back.
max_consecutive_losing_trips = 10
# EWMA of the net bps of the last 20 round trips (after both fees).
min_trip_net_bps_ewma = -2.0
# Seconds the unhedged delta may stay above [inventory] max_unhedged_usd before the kill fires.
max_hedge_fail_s = 30.0

[quote]
# The maker_inventory quoting rule.  edge_min_bps is measured after the hedge venue taker fee,
# the maker venue fee and reserve_bps; it gates only the side that would GROW the inventory.
edge_min_bps = 3.0
reserve_bps = 0.0
# Minimum seconds between two re-prices of one side.  3 s held the offline PONS replay to
# 26 tx/min with zero deferrals.
requote_min_s = 3.0
# Local token bucket over Lighter order transactions.  The venue allows 40 sendTx/min per L1
# address shared by creates, modifies and cancels; hard cap 40, stay below it.
tx_per_min = 36.0
# Where a quote rests (src/quote_placement.py explains the choice and the evidence):
#   "improve"  one tick inside the Lighter touch, queue ahead 0.  What the maker ran until
#              2026-09-09, and what gets picked off in a fast market: that session took 40
#              fills whose MEDIAN edge against the hedge was +5.5 bps but whose MEAN was
#              -8.5 bps (worst -85), i.e. a handful of stale-quote fills ate the whole day.
#   "join"     at the Lighter touch, behind whatever size is already resting there.
#   "anchor"   priced off the ASTER mid, anchor_edge_bps away from it, then clamped so it can
#              never cross the Lighter book.  The quote stops following the venue we do not
#              hedge on, so a Lighter-only jump cannot leave us resting at a price the hedge
#              will not honour.
placement = "anchor"
# How far off the fair mid an "anchor" quote rests.  Bigger = further out = fewer, better
# fills, so the rail is a FLOOR of 3 bps: configuration may demand more edge, never less.
anchor_edge_bps = 20.0
# The fair mid the anchor is centred on is NOT the raw hedge mid: Lighter's PONS mid trades a
# median +28.8 bps (09-07) / +25.7 bps (09-08) ABOVE Aster's, and anchoring on Aster put the
# ask inside Lighter's book and the bid where it could never fill - 10 to 20x more ask fills
# than bid fills, inventory pinned at its cap.  So the centre is h_mid * (1 + b) with b the
# rolling MEDIAN of (m_mid / h_mid - 1) over this window.  Floors: 10 s, and 10 samples.  The
# opening side stays silent until basis_min_n samples have arrived.
basis_window_s = 300
basis_min_n = 30
# Lean both anchor prices by -anchor_skew_bps * (q / q_cap) so a long book quotes lower on
# both sides and works itself back to flat.  0 = symmetric around the fair mid.
anchor_skew_bps = 0.0
# Legacy spelling of the same choice, kept so an old file still means what it said: 1 =
# improve by one tick, 0 = join the touch.  An explicit `placement` above always wins.
improve_ticks = 1
# Lighter's minimum order (20 PONS ~ 15.6 USD) is close to max_notional_usd, so a residual
# smaller than that minimum cannot be closed passively at all: the closing side simply stops
# quoting and the inventory sits there.  With this on, a closing side whose clip would be
# below the venue minimum is quoted AT the venue minimum instead.  A full fill then carries
# the position through zero by (venue_min - |q|), which is itself under the venue minimum and
# is hedged like any other fill.  Set false to keep the strict never-flip rule, which is also
# what the offline simulator does.
close_min_flip = true

# --- opening gates ------------------------------------------------------------------
# Added after the 2026-09-09 mainnet session and the 09-07 / 09-08 replays; the reasoning and
# the numbers behind them are in src/quote_gates.py.  Both gate ONLY the side that would grow
# the inventory: the closing side keeps quoting so a position can always be worked off, a
# resting opening quote is cancelled when a gate closes, and the kill switch is unchanged.
# Opening is allowed only while BOTH are open.
#
# SPREAD GATE.  The maker touch spread (median of the last spread_window_s seconds, so a
# single flickering sample cannot open it) must be at least min_spread_ratio times the hedge
# round trip - the Aster touch spread plus the Aster taker fee plus the Lighter maker fee -
# and at least min_maker_spread_bps in absolute terms.  On 2026-09-09 the Lighter PONS spread
# was 5.9 bps against a ~8.6 bps hedge round trip: nothing to capture, ~10 bps to pay.
# Hard FLOOR 1.0 - a ratio under 1 means the spread does not even cover the hedge.
min_spread_ratio = 1.0
# Hard FLOOR 5 bps.
min_maker_spread_bps = 5.0
# Hard FLOOR 1 s.
spread_window_s = 10
#
# VOLATILITY GATE.  A wide spread is not enough: on the 09-08 recording the Lighter spread was
# still 30-35 bps and the replay lost 47 USD, the damage in the 15:00-16:59 UTC hours, and the
# profitable 09-07 replay lost money in those same hours.  That is adverse selection in a fast
# market.  Stop opening while the maker mid's range over vol_window_s exceeds this.
# Hard FLOOR 5 bps (a smaller limit would never open) and hard CAP 50 bps - for this knob a
# LARGER number is the looser one, so it is the one gate key that also needs a cap.
# 0 = OFF (decision 2026-09-09: under the anchor placement the volatility gate only
# subtracts, and a 60 s range does not match the 3 s requote cycle). 5..50 re-enables it.
max_move_bps_per_min = 0
# Hard FLOOR 1 s.
vol_window_s = 60

[stop]
# How the run ends.  The deadline, the kill switch and SIGINT all follow the same sequence:
# cancel -> WAIT for the venue to confirm every order terminal -> close both legs -> exit.
#
# Every mainnet session on 2026-09-10 exited with one order still PENDING_CANCEL ("LEFTOVER
# ... NOT venue-confirmed") and once that order FILLED after the process was gone, so the
# position was not what the summary said.  Wait this long for every order of ours to reach a
# terminal state, re-sending a cancel every 5 s for anything still open; a fill reported
# during the wait is booked like any other.  Hard FLOOR 5 s - longer is safer.
cancel_confirm_s = 20.0
# The cleanup used to hedge only the UNHEDGED delta, which leaves the hedged pair in place -
# maker SHORT 1.55 against hedge LONG 1.55 - and the next session's start guard refuses it.
# With this on, the stop closes BOTH legs to zero with the same IOC clips --flatten uses.
flatten_on_stop = true
# Hard FLOOR 10 s.
flatten_timeout_s = 30.0

[hedge]
venue = "ASTER"
# The hedge is a LIMIT IOC at the Aster touch offset by this much - never a MARKET order.
slippage_bps = 20.0
# Residual delta below this notional waits instead of being hedged one dust order at a time.
# 0 = use the Aster instrument's own min_notional (5 USD).
aggregate_min_notional_usd = 5.0
# ... but it never waits longer than this before rounding up to the venue minimum.
max_wait_s = 5.0

# Restricted Ondo production-trade implementation envelope.
#
# This section enables offline plan/config construction only. It does not authorize account
# connection, DMS, submit, cancel, or any other production side effect. A live run still
# requires the native capability contract, a fully resolved hash-bound plan, current-turn
# authorization, and every runtime start gate.
[ondo_trade]
instrument = "NVDA-USD-PERP.ONDO"
symbol = "NVDA"

# User-selected target band is USD 10-20; this implementation proposes USD 15.
entry_notional_usd = "15"

# Hard outer rails from CLAUDE.md/user scope.
max_notional_per_order_usd = "50"
max_gross_exposure_usd = "100"

# Exactly one opening attempt plus at most two reduce-only exit attempts.
max_orders = 3
max_new_risk_requests = 1

# App-visible writes: creates plus own-order cancels. Native background reads are excluded.
max_app_requests = 6

# Same-unit operator buffer in USDC. This is not an FX conversion and not a venue minimum.
# Higher is stricter; the app/native hard safety floor is 25 USDC for the current USD15 target.
min_available_margin_usdc = "25"

# Total bounded session, with the final 5 seconds reserved for exits/cancels/reconciliation.
deadline_secs = 600
max_close_attempts = 2
max_slippage_bps = "20"
cleanup_budget_secs = 5


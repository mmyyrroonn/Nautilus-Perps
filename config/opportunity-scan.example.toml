# Public data only. Fee/FX values marked Configured are assumptions to verify.
schema_version = 1

[scan]
target_notional = "500"
min_entry_edge_bps = "1"
reserve_bps = "5"
max_age_ms = 2000
max_receive_age_ms = 2000
max_skew_ms = 500

[recording]
enabled = true
path = "../reports/opportunities/opportunities.jsonl"
cooldown_ms = 5000
edge_change_bps = "2"
quantity_change_fraction = "0.1"
# Optional: save a still-qualified opportunity at least every 60 seconds.
# max_interval_ms = 60000

[runtime]
duration_secs = 3600 # Set to 0 to run until Ctrl+C.
depth_levels = 20
max_levels_per_side = 2000
refresh_ms = 1000
top_n = 20
connection_timeout_secs = 30

[[markets]]
symbol = "BTC"
venue = "HL"
instrument_id = "BTC-USD-PERP.HYPERLIQUID"
quote_to_usd = "1"
valuation_source = "Configured USD/USDC/USDT parity assumption"
taker_fee_bps = "4.5"
fee_source = "Configured indicative rate; verify current account tier"


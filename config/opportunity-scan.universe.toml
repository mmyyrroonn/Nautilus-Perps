# Generated public crypto registry; assumptions require verification.
schema_version = 1

[scan]
target_notional = "500"
min_entry_edge_bps = "1"
reserve_bps = "5"
max_age_ms = 2000
max_skew_ms = 500
max_receive_age_ms = 2000

[recording]
enabled = true
path = "../reports/opportunities/opportunities.jsonl"
cooldown_ms = 5000
edge_change_bps = "2"
quantity_change_fraction = "0.1"

[runtime]
connection_timeout_secs = 120
duration_secs = 3600
depth_levels = 20
max_levels_per_side = 20000
refresh_ms = 1000
top_n = 20
evaluation_interval_ms = 100
aster_snapshot_depth = 100
aster_subscription_interval_ms = 500


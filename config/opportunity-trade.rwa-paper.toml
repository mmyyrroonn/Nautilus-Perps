# Public market data + compressed L2 tape recording for RWA backtesting; never registers execution clients.
schema_version = 1
mode = "paper"
scan_config = "opportunity-scan.rwa.toml"
state_path = "../reports/opportunity-trading/rwa-paper.sqlite3"

[trade]
order_notional_usd = "20"
# Suppress simulated paper-trade SQLite churn during pure L2 tape collection.
entry_edge_bps = "5000"
take_profit_bps = "10"
max_loss_bps = "50"
loss_stop_enabled = true
breakeven_after_secs = 180
force_close_after_secs = 300
slippage_bps = "0"

# Operator-run multi-venue trading. Default CLI action validates without connecting.
# Tightened trial scale: USD 20 per leg, USD 100 gross cap, at most two concurrent pairs.
schema_version = 1
# Aster targets default to verified account leverage at initialization.
# Optional per-instrument targets override this default. No venue setting is changed.
# See docs/aster-leverage-admission.md.
mode = "live"
environment = "mainnet"
scan_config = "opportunity-scan.universe.toml"
state_path = "../reports/opportunity-trading/live.sqlite3"
limits_path = "limits.toml"
# All order mutations use the matching native Nautilus execution factory.
venues = ["HYPERLIQUID", "LIGHTER", "ASTER", "BACKPACK"]
# Exclude persistent non-converging basis traps identified in live diagnostics.
excluded_symbols = ["INIT"]

[trade]
order_notional_usd = "20"
entry_edge_bps = "20"
take_profit_bps = "18"
max_loss_bps = "150"
loss_stop_enabled = true
breakeven_after_secs = 600
force_close_after_secs = 1800
slippage_bps = "0"
hard_exit_slippage_bps = "10"
soft_exit_execution_buffer_bps = "2"
min_l1_depth_multiple = "3"
max_leg_spread_bps = "25"
max_rolling_leg_spread_bps = "20"
rolling_leg_spread_window_secs = 300
rolling_leg_spread_min_samples = 10
entry_execution_mode = "slow_first"
soft_exit_execution_mode = "slow_first"
sequential_leg2_slippage_bps = "15"
loss_cooldown_secs = 60
max_exit_reversal_bps = "30"
max_exit_reversal_edge_ratio = "1"
slow_venues = ["HL", "LIGHTER"]
slow_pair_entry_edge_bps = "24"
slow_pair_min_persistence_ms = 0

[trade.entry_slippage_bps_by_venue]
ASTER = "2"
BACKPACK = "2"
HL = "4"
LIGHTER = "2"

[trade.maker_fee_bps_by_venue]
ASTER = "1"
BACKPACK = "0"
HL = "1.5"
LIGHTER = "0"

[entry_admission]
# Local entry handoff budgets, validated offline; no guarantee of venue execution.
# Effective source/receive/skew limits also respect stricter scan settings.
max_source_age_ms = 1000
max_receive_age_ms = 1000
max_skew_ms = 500
# Native receive -> strategy publication includes delivery queues and coalescing.
max_publication_wait_ms = 150
max_dispatch_delay_ms = 100

[basis_filter]
enabled = true
# Rolling mid-basis lookback window and startup warmup (seconds).
window_secs = 600
warmup_secs = 120
# Minimum transient deviation above the route's rolling basis (bps), in addition to entry_edge_bps.
min_deviation_bps = "10"
# Extended route cooldown / block after consecutive non-converging max_hold losses.
max_hold_loss_cooldown_secs = 900
max_hold_loss_block_strikes = 2
max_hold_loss_block_secs = 3600

[risk]
# Zero refuses all execution; values can only tighten the total USD 500 hard cap.
max_pairs = 2
max_gross_notional_usd = "100"
# Per-pair confirmed canonical delta. Either limit triggers a latched hard exit.
# Independent of order queries and maximum holding time; may only be tightened.
max_unhedged_notional_usd = "25"
max_unhedged_secs = 10
# Minimum reserve below each standalone leg's conservative ask/limit valuation.
# Quantities round down after this reserve; price jumps still trigger the hard cap.
entry_unhedged_reserve_bps = "10"
# Immediate intra-window circuit breakers (do not wait for the 600s equity check).
max_session_realized_loss_usd = "10"
max_consecutive_losses = 20
max_consecutive_single_legs = 20
entry_reject_block_secs = 1800

[loss_monitor]
enabled = true
max_loss_usd = "20"
interval_secs = 600
read_timeout_secs = 60
retry_interval_secs = 5
# Pause new pairs when due; let existing pairs finish normally, then value flat accounts.
# Each process captures its own baseline before any startup trading or strategy entry.

[startup]
self_test_enabled = false
# Independently read and report native balances before trading; failure blocks startup.
balance_check_enabled = false
# Actual BTC clip uses each venue's current lot/minimum; this is only an outer cap.
max_notional_usd = "50"
slippage_bps = "20"
# Complete native account cycles can take about ten seconds before a fresh fence.
timeout_secs = 20

[runtime]
duration_secs = 0
drain_timeout_secs = 30
timer_interval_ms = 100
# Market publication/evaluation: 100 baseline, 50 balanced, 20 small batches, 0 per complete event.
# Change after comparing CPU, queue tails and admission decisions for this deployment.
evaluation_interval_ms = 20
backpack_quote_cache_only = true
backpack_depth_coalesce_ms = 5
coalesce_book_deltas = true
# Complete native account reads may take several seconds; BBO freshness is separate.
account_max_age_ms = 60000
lighter_margin_max_age_ms = 60000
order_timeout_secs = 10
retry_interval_ms = 1000

[aster_leverage]
max_age_ms = 15000

# Operator-run multi-venue trading. Default CLI action validates without connecting.
# User-selected initial total scale: USD 500, at most two concurrent pairs.
schema_version = 1
mode = "live"
environment = "mainnet"
scan_config = "opportunity-scan.universe.toml"
state_path = "../reports/opportunity-trading/live.sqlite3"
limits_path = "limits.toml"
# All order mutations use the matching native Nautilus execution factory.
venues = ["HYPERLIQUID", "LIGHTER", "ASTER", "ONDO", "BACKPACK"]

[trade]
order_notional_usd = "100"
entry_edge_bps = "30"
take_profit_bps = "5"
max_loss_bps = "150"
loss_stop_enabled = true
breakeven_after_secs = 180
force_close_after_secs = 300
slippage_bps = "0"

[risk]
# Zero refuses all execution; values can only tighten the total USD 500 hard cap.
max_pairs = 2
max_gross_notional_usd = "500"
# Per-pair confirmed canonical delta. Either limit triggers a latched hard exit.
# Independent of order queries and maximum holding time; may only be tightened.
max_unhedged_notional_usd = "100"
max_unhedged_secs = 10

[loss_monitor]
enabled = true
max_loss_usd = "200"
interval_secs = 600
read_timeout_secs = 60
retry_interval_secs = 5
# Pause new pairs when due; let existing pairs finish normally, then value flat accounts.
# Each process captures its own baseline before any startup trading or strategy entry.

[startup]
self_test_enabled = false
# Independently read and report native balances before trading; failure blocks startup.
balance_check_enabled = false
# Actual BTC clip uses each venue's current lot/minimum; this is only an outer cap.
max_notional_usd = "50"
slippage_bps = "20"
# Complete native account cycles can take about ten seconds before a fresh fence.
timeout_secs = 20

[runtime]
duration_secs = 0
drain_timeout_secs = 30
timer_interval_ms = 100
# Complete native account reads may take several seconds; BBO freshness is separate.
account_max_age_ms = 60000
order_timeout_secs = 10
retry_interval_ms = 1000
